# PlatformIO override for the Divoom Pixoo 64 custom WLED build
# ------------------------------------------------------------------------------
# Board: ESP32-WROVER-IE (ESP32-D0WD-V3, 8MB flash, PSRAM on GPIO16/17)
# Flash mode MUST stay dio / 40MHz (stock bootloader is DIO/40m; WROVER PSRAM
# also requires DIO). Partition layout must match stock offsets - see
# tools/pixoo64_partitions.csv.

[platformio]
default_envs = pixoo64

[env:pixoo64]
board = esp-wrover-kit
platform = ${esp32_idf_V4.platform}
platform_packages = ${esp32_idf_V4.platform_packages}
build_unflags = ${common.build_unflags}
custom_usermods = audioreactive
build_flags = ${common.build_flags} ${esp32_idf_V4.build_flags} -D WLED_RELEASE_NAME=\"PIXOO64\"
  -DARDUINO_USB_CDC_ON_BOOT=0 ;; mandatory for "classic ESP32" with arduino-esp32 >= 2.0.3
  -DBOARD_HAS_PSRAM -mfix-esp32-psram-cache-issue
  -D WLED_ENABLE_PIXOO64 ;; BusPixoo: Divoom Pixoo 64 panel over SPI (CLK=25, MOSI=33, CS=26)
  -D MAX_LEDS_PER_BUS=4096 ;; the panel has 4096 pixels (default clamp is 2048)
  -D LED_TYPES=TYPE_PIXOO64 ;; default bus on first boot / missing config
  -D DATA_PINS=25,33,26 ;; default bus pins: CLK, MOSI, CS
  -D PIXEL_COUNTS=4096
  -D DEFAULT_LED_COLOR_ORDER=COL_ORDER_RGB
lib_deps = ${esp32_idf_V4.lib_deps}
monitor_filters = esp32_exception_decoder
board_build.partitions = tools/pixoo64_partitions.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.flash_mode = dio
board_build.f_flash = 40000000L
upload_speed = 921600
